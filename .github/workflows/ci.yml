name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zig-test:
    name: Zig Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Run Zig tests
        run: zig build test

      - name: Build WASM (ReleaseSmall)
        run: zig build -Doptimize=ReleaseSmall

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: zig-auth-wasm
          path: zig-out/bin/zig-auth.wasm

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: zig-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: zig-auth-wasm
          path: worker/

      - name: Generate wrangler.toml for local testing
        run: cp wrangler.toml.example wrangler.toml

      - name: Install API dependencies
        run: pnpm install

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply zig-auth-dev --local

      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install chromium

      - name: Run E2E tests
        working-directory: web
        run: pnpm exec playwright test
        env:
          CI: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results/

