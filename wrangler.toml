name = "zig-auth"
main = "worker/index.mjs"
compatibility_date = "2024-12-01"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "zig-auth-db"
database_id = "placeholder-fill-after-d1-create"

[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "placeholder-fill-after-kv-create"
preview_id = "placeholder-fill-after-kv-create-preview"

[vars]
ALLOWED_ORIGINS = "*"
APP_URL = "http://localhost:8787"
FRONTEND_URL = "http://localhost:5173"
EMAIL_FROM = "noreply@example.com"

# Secrets (set via: wrangler secret put <NAME>)
# JWT_SECRET
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
